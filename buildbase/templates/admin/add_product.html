<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Add Product</title>
    <link rel="stylesheet" href="{% static 'css/admin_add.css' %}">
</head>
<body>
    <h1>Add New Product</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Product</button>
    </form>

    <p><a href="{% url 'admin_home' %}">Back to Dashboard</a></p>
</body>
</html>
