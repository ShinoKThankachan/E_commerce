<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>All Orders</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>
    <h1>All Orders</h1>

    <table border="1">
        <tr>
            <th>User</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Ordered At</th>
            <th>Status</th>
        </tr>
        {% for order in orders %}
        <tr>
            <td>{{ order.user.username }}</td>
            <td>{{ order.product.name }}</td>
            <td>{{ order.quantity }}</td>
            <td>{{ order.ordered_at }}</td>
            <td>{{ order.status }}</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="{% url 'admin_home' %}">Back to Dashboard</a></p>
</body>
</html>
