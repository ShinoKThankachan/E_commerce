<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>
    <h1>Admin Dashboard</h1>

    <p><a href="{% url 'add_product' %}">Add New Product</a> | 
       <a href="{% url 'view_all_orders' %}">View All Orders</a> |
       <a href="{% url 'logout' %}">Logout</a></p>

    <h2>All Products</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>₹{{ product.price }}</td>
            <td>{{ product.stock }}</td>
            <td>
                <a href="{% url 'edit_product' product.id %}">Edit</a> |
                <a href="{% url 'delete_product' product.id %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
